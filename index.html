<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi novia/o?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>💕 ¿Quieres ser mi novia/o? 💕</h1>
            <p class="subtitle">Tengo algo importante que preguntarte...</p>
            
            <div class="buttons">
                <button class="btn btn-yes" onclick="handleYes()">Sí 💚</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="handleNo()">No 💔</button>
            </div>
            
            <div class="confetti" id="confetti"></div>
        </div>
    </div>

    <div class="modal" id="modal" style="display:none;">
        <div class="modal-content">
            <div class="success-message">
                <h2>¡Siii! 🎉</h2>
                <p>¡Eres la/el más especial para mí!</p>
                <p class="heart">💕</p>
                <button onclick="closeModal()" class="btn btn-yes">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
